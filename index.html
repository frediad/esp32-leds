<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Monitor ESP32 LEDs</title>

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    .container {
      width: 80%;
      margin: auto;
      margin-top: 20px;
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 10px;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
    }

    th {
      background: rgba(255,255,255,0.2);
    }

    tr:hover {
      background: rgba(255,255,255,0.1);
    }

    .verde {
      color: #00ff88;
      font-weight: bold;
    }

    .rojo {
      color: #ff4d4d;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>📡 Monitor de LEDs ESP32</h1>

<div class="container">
  <table>
    <thead>
      <tr>
        <th>LED</th>
        <th>Estado</th>
        <th>Fecha</th>
      </tr>
    </thead>
    <tbody id="tabla"></tbody>
  </table>
</div>

<script>

async function cargarDatos() {
  try {
    const res = await fetch("/api/getLeds");
    const data = await res.json();

    let html = "";

    data.forEach(d => {

      let clase = d.led === "VERDE" ? "verde" : "rojo";

      html += `
        <tr>
          <td class="${clase}">${d.led}</td>
          <td>${d.estado}</td>
          <td>${new Date(d.fecha).toLocaleString()}</td>
        </tr>
      `;
    });

    document.getElementById("tabla").innerHTML = html;

  } catch (error) {
    console.error(error);
  }
}


</script>

</body>
</html>
